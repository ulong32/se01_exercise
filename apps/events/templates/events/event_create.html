{% extends 'base.html' %}

{% block title %}Create Event - Event Listings{% endblock %}

{% block content %}
    <section class="form-container" aria-labelledby="create-heading">
        <div class="form-card">
            <h1 id="create-heading" class="form-title">Create New Event</h1>
            <form method="POST" action="{% url 'events:event_create' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title" class="form-label">Title:</label>
                    <input type="text" id="title" name="title" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description:</label>
                    <textarea id="description" name="description" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label for="date" class="form-label">Date & Time:</label>
                    <input type="datetime-local" id="date" name="date" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="location" class="form-label">Location:</label>
                    <input type="text" id="location" name="location" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="category_id" class="form-label">Category:</label>
                    <select id="category_id" name="category_id" class="form-control" required>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Event</button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
