{% extends 'base.html' %}

{% block title %}Events - Event Listings{% endblock %}

{% block content %}
<section aria-labelledby="events-heading">
    <h1 id="events-heading">Explore Events</h1>
    <form method="GET" action="{% url 'events:event_list' %}" class="search-form" role="search">
        <label for="search-input" class="form-label">Search:</label>
        <input type="text" id="search-input" name="q" class="search-input" placeholder="Search events by title..."
            value="{{ request.GET.q|default:'' }}"
            hx-get="{% url 'events:event_list' %}"
            hx-trigger="input changed delay:300ms, search"
            hx-target="#event-results"
            hx-swap="outerHTML">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    {% include 'events/_event_results.html' %}
</section>
{% endblock %}
