{% extends 'base.html' %}

{% block title %}Edit Event - Event Listings{% endblock %}

{% block content %}
    <section class="form-container" aria-labelledby="edit-heading">
        <div class="form-card">
            <h1 id="edit-heading" class="form-title">Edit Event</h1>
            <form method="POST" action="{% url 'events:event_edit' event.id %}" data-submit-protect>
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title" class="form-label">Title:</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ event.title }}" required>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description:</label>
                    <textarea id="description" name="description" class="form-control" required>{{ event.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="date" class="form-label">Date & Time:</label>
                    <input type="datetime-local" id="date" name="date" class="form-control" value="{{ event.date|date:'Y-m-d\TH:i' }}" required>
                </div>

                <div class="form-group">
                    <label for="location" class="form-label">Location:</label>
                    <input type="text" id="location" name="location" class="form-control" value="{{ event.location }}" required>
                </div>

                <div class="form-group">
                    <label for="category_id" class="form-label">Category:</label>
                    <select id="category_id" name="category_id" class="form-control" required>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id == event.category.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Event</button>
                    <a href="{% url 'events:event_detail' event.id %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </section>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof flatpickr !== "undefined") {
                flatpickr("#date", {
                    enableTime: true,
                    dateFormat: "Y-m-d\\TH:i",
                    time_24hr: true
                });
            }
        });
    </script>
{% endblock %}
